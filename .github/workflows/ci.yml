name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAUDEMON_HOME: ${{ github.workspace }}/.claudemon-ci

jobs:
  sprites:
    runs-on: [self-hosted, Linux, X64, ajay-trusted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        id: sprites
        with:
          path: .claudemon-ci/data/sprites
          key: sprites-${{ hashFiles('tools/fetch-sprites.mjs') }}

      - if: steps.sprites.outputs.cache-hit != 'true'
        run: node tools/fetch-sprites.mjs

  lint:
    runs-on: [self-hosted, Linux, X64, ajay-trusted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  test:
    needs: sprites
    runs-on: [self-hosted, Linux, X64, ajay-trusted]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - uses: actions/cache/restore@v4
        with:
          path: .claudemon-ci/data/sprites
          key: sprites-${{ hashFiles('tools/fetch-sprites.mjs') }}

      - run: node tools/fetch-sprites.mjs

      - run: npm test

  coverage:
    needs: sprites
    runs-on: [self-hosted, Linux, X64, ajay-trusted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/cache/restore@v4
        with:
          path: .claudemon-ci/data/sprites
          key: sprites-${{ hashFiles('tools/fetch-sprites.mjs') }}

      - run: node tools/fetch-sprites.mjs

      # Thresholds live in vitest.config.mjs, so a drop fails here.
      - name: Measure
        shell: bash
        run: |
          set -o pipefail
          npm run coverage | tee /tmp/coverage.txt

      - name: Report
        if: always()
        shell: bash
        run: |
          if [ ! -f /tmp/coverage.txt ]; then
            echo 'Coverage did not get far enough to report.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Coverage'
            echo ''
            echo '```'
            sed -n '/^ *File/,$p' /tmp/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

  dataset:
    needs: sprites
    runs-on: [self-hosted, Linux, X64, ajay-trusted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: actions/cache/restore@v4
        with:
          path: .claudemon-ci/data/sprites
          key: sprites-${{ hashFiles('tools/fetch-sprites.mjs') }}

      - run: node tools/fetch-sprites.mjs

      - run: npm run mechanics:coverage

      - run: node tools/check-data.mjs
