name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAUDEMON_HOME: ${{ github.workspace }}/.claudemon-ci

jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        id: sprites
        with:
          path: .claudemon-ci/data/sprites
          key: sprites-${{ hashFiles('tools/fetch-sprites.mjs') }}

      - if: steps.sprites.outputs.cache-hit != 'true'
        run: node tools/fetch-sprites.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  test:
    needs: sprites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/cache/restore@v4
        with:
          path: .claudemon-ci/data/sprites
          key: sprites-${{ hashFiles('tools/fetch-sprites.mjs') }}

      - run: node tools/fetch-sprites.mjs

      - run: node --test test/*.test.mjs

  dataset:
    needs: sprites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache/restore@v4
        with:
          path: .claudemon-ci/data/sprites
          key: sprites-${{ hashFiles('tools/fetch-sprites.mjs') }}

      - run: node tools/fetch-sprites.mjs

      - run: node tools/check-data.mjs
